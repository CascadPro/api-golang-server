services:
  cascade-app:
    container_name: cascade-app-server
    restart: always
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HTTP_ADDR=:8000
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - HTTP_DOMAIN=${HTTP_DOMAIN}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=cascade-app-postgres
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE}
      - REDIS_MIN_IDLE_CONNS=${REDIS_MIN_IDLE_CONNS}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_SESSION_TOKEN=${S3_SESSION_TOKEN}
      - S3_TIMEOUT=${S3_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - SECRET_KEY_JWT=${SECRET_KEY_JWT}
      - SECRET_KEY_UPLOAD=${SECRET_KEY_UPLOAD}
      - CORE_TIME_ZONE=${CORE_TIME_ZONE}
      - CORE_CONNECTION=${CORE_CONNECTION}
      - CORE_ALLOWED_ORIGINS=${CORE_ALLOWED_ORIGINS}
    depends_on:
      cascade-app-postgres:
        condition: service_healthy
      cascade-app-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    networks:
      - cascade-pro

  cascade-app-postgres:
    container_name: cascade-app-postgres-database
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ${PROJECT_ROOT}/out/pg_data:/var/lib/postgresql/data
    networks:
      - cascade-pro

  cascade-app-redis:
    container_name: cascade-app-redis-database
    image: redis:5.0
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server
    # command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${PROJECT_ROOT}/out/redis_data:/data
    networks:
      - cascade-pro

  cascade-app-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    networks:
      - cascade-pro

  port-forwarder:
    container_name: port-forwarder
    image: alpine/socat:1.8.0.3
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:cascade-app-postgres:5432
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - cascade-pro

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.25.10-alpine3.23
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code
    networks:
      - cascade-pro

networks:
  cascade-pro:
